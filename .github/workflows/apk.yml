name: Build Android app
# The Android app for the Solana dApp Store: a web shell (WebView) of shyonsol.io built with Solana Mobile's webshell CLI,
# which hands wallet requests to the phone's wallet through Mobile Wallet Adapter. (The first version was a Trusted Web
# Activity; the store now recommends the web shell because browsers are blocking the local wallet link TWAs rely on.)
# Runs when anything in twa/ changes, or by hand. The signed APK lands on a GitHub Release.
on:
  push:
    branches: [main]
    paths: ['twa/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd twa
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > shy-release.keystore
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"; echo "KIND=release" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore shy-release.keystore -storetype PKCS12 -alias shy -keyalg RSA -keysize 2048 -validity 365 -storepass "$P" -keypass "$P" -dname "CN=Test build" > /dev/null
            echo "::add-mask::$P"; echo "KS_PASS=$P" >> "$GITHUB_ENV"; echo "KIND=test" >> "$GITHUB_ENV"
            echo "::warning::No signing key secrets set: this is a TEST build signed with a throwaway key. Do not submit it."
          fi
      - name: Build
        run: |
          cd twa
          export SOLANA_MOBILE_KEYSTORE_PASSWORD="$KS_PASS" SOLANA_MOBILE_KEY_PASSWORD="$KS_PASS"
          VN=$(python3 -c "import json;print(json.load(open('twa-manifest.json'))['appVersionName'])")
          VC=$(python3 -c "import json;print(json.load(open('twa-manifest.json'))['appVersionCode'])")
          set -o pipefail
          # the web shell: a WebView app that opens the game and hands wallet requests to the phone's wallet (Mobile Wallet Adapter)
          npx --yes solana-mobile@latest webshell init shell --force --manifest ./twa-manifest.json --url "https://shyonsol.io/play?src=app" \
            --app-name "Shilluminati" --application-id io.shyonsol.twa --version-name "$VN" --version-code "$VC" \
            --keystore-path "$PWD/shy-release.keystore" --keystore-alias shy 2>&1 | tee ../bw-update.log
          # our icon, splash and colors over the generated defaults
          cp -r res/. shell/app/src/main/res/
          npx --yes solana-mobile@latest webshell build shell --stacktrace 2>&1 | tee ../bw-build.log
          ls -la shell/app/build/outputs/apk/release/
      - name: Report a failure
        if: failure()
        run: |
          for f in bw-update.log bw-build.log; do [ -f "$f" ] && echo "::error title=$f::$(tail -c 1800 $f | tr '\n' ' ' | sed 's/%/%25/g')"; done
          [ -f bw-build.log ] && echo "::error title=what went wrong::$( (grep -A 14 'What went wrong' bw-build.log; grep -iE '^e: |error:|\bfailed\b' bw-build.log | head -20) | head -c 3500 | tr '\n' ' ' | sed 's/%/%25/g')"; true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd twa
          V=$(python3 -c "import json;d=json.load(open('twa-manifest.json'));print(d['appVersionName']+'-'+str(d['appVersionCode']))")
          TAG="android-$V-$KIND-${GITHUB_RUN_NUMBER}"
          cp shell/app/build/outputs/apk/release/app-release.apk "shilluminati-$V-$KIND.apk"
          SHA=$(keytool -list -v -keystore shy-release.keystore -storepass "$KS_PASS" | grep 'SHA256:' | head -1 | awk '{print $2}')
          gh release create "$TAG" "shilluminati-$V-$KIND.apk" --title "Android app $V ($KIND)" \
            --notes "Built as a web shell (solana-mobile webshell) from twa/twa-manifest.json. Signing certificate SHA-256: $SHA" $( [ "$KIND" = test ] && echo --prerelease )
