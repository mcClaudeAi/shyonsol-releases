#MC 2026-10-14 the hands-off half of pull deploys. A push that adds a release zip makes this job call
#   api/deploy-pull.php on shyonsol.io with the zip's raw link and SHA-256. The deploy key lives only in
#   this repo's DEPLOY_KEY secret, so it never rides along in a commit or a chat. The endpoint checks the
#   hash before touching anything, so a bad upload just fails here and the site stays as it was.
name: Deploy to shyonsol.io
#MC 2026-10-14 workflow_dispatch so a deploy can also be fired by hand from the Actions tab (re-deploys the newest zip)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call pull deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          #MC 2026-10-14 the zip this push added, else the newest one in the repo
          Z=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '\.zip$' | head -1)
          [ -n "$Z" ] || Z=$(ls -t *.zip | head -1)
          [ -n "$Z" ] || { echo "no zip in this push"; exit 1; }
          SHA=$(sha256sum "$Z" | cut -d' ' -f1)
          U="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${Z}"
          echo "deploying $Z ($SHA)"
          #MC 2026-10-22 Hostinger's CDN started answering this call with a 307 back to itself (a cookie check on visitors it
          #   doesn't know). Keeping its cookie and following the redirect, which keeps the POST, gets through it.
          R=$(curl -s -L --max-redirs 5 -c /tmp/cj -b /tmp/cj -D /tmp/h.txt https://shyonsol.io/api/deploy-pull.php --data-urlencode "k=${DEPLOY_KEY}" --data-urlencode "u1=${U}" --data-urlencode "sha=${SHA}")
          #MC 2026-10-22 the answer's status and where a redirect points, for checks/deploy-last.txt (no body secrets in either)
          H=$(grep -iE '^(HTTP/|location:|server:|x-|cf-|platform)' /tmp/h.txt | tr -d '\r' | tr '\n' ' ' | head -c 400)
          echo "$R"
          #MC 2026-10-22 the server's answer is kept in the repo too (checks/deploy-last.txt), so a failed deploy says why
          #   without opening the Actions log. The answer never carries the key.
          echo "$(date -u +%FT%TZ) $Z [$H] $(echo "$R" | head -c 600)" > checks/deploy-last.txt
          git config user.name "deploy"; git config user.email "deploy@users.noreply.github.com"
          git add checks/deploy-last.txt; git commit -q -m "Deploy result" && (git pull --rebase -q && git push -q) || true
          echo "$R" | grep -q '"ok":true'
