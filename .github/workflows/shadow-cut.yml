#MC 2026-10-24 Living Shadows: cuts each Shadow out of its background (checks/shadow_cut.py). "sample" runs when the
#   sample list or the script changes and commits a contact sheet to look at; the live run asks shyonsol.io which
#   Shadows still need a cut (new holders show up as they connect), every six hours or by hand.
name: Shadow cutouts
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['checks/cut-sample.txt', 'checks/shadow_cut.py', 'checks/cut-run.txt']
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: mode
        #MC 2026-10-24 a push that touches checks/cut-run.txt runs the live cut, so a run can be started without the Actions tab
        run: |
          if [ "${{ github.event_name }}" != "push" ] || git diff --name-only HEAD~1 HEAD | grep -q 'checks/cut-run.txt'; then echo "m=live" >> "$GITHUB_OUTPUT"; else echo "m=sample" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q "rembg[cpu]==2.0.59" pillow numpy scipy transformers==4.46.3 torch==2.5.1 --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Sample
        if: steps.mode.outputs.m == 'sample'
        run: |
          python3 checks/shadow_cut.py sample
          git config user.name "shadow-cut"; git config user.email "shadow-cut@users.noreply.github.com"
          git add checks/cut-sample; git commit -q -m "Shadow cut sample" || exit 0
          git pull --rebase -q && git push -q
      - name: Live
        if: steps.mode.outputs.m == 'live'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          python3 checks/shadow_cut.py live 2>&1 | tee /tmp/cut.log
          #MC 2026-10-24 what the run did is kept in the repo (checks/cut-last.txt), like the deploy result
          (date -u +%FT%TZ; tail -60 /tmp/cut.log) > checks/cut-last.txt
          git config user.name "shadow-cut"; git config user.email "shadow-cut@users.noreply.github.com"
          git add checks/cut-last.txt; git commit -q -m "Shadow cut result" && (git pull --rebase -q && git push -q) || true
